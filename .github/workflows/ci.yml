name: CI

on:
  pull_request:
  push:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: pnpm/action-setup@v4
        with:
          version: 10

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm turbo run lint

      - name: Typecheck
        run: pnpm turbo run typecheck

      - name: Unit tests
        run: pnpm turbo run test

      # API integration tests (apps/api/test/*.e2e-spec.ts) exercise the
      # real Nest Controller -> Guard -> Validation -> Service pipeline
      # over HTTP via supertest, with PrismaService/RedisService mocked —
      # see apps/api/test/utils/build-test-app.ts. No live Postgres/Redis
      # needed, so this runs in the same fast job as everything else
      # rather than a separate DB-service job.
      - name: API integration tests
        run: pnpm turbo run test:e2e

      - name: Build
        run: pnpm turbo run build
